    const funcionario = exigirLogin("funcionario", "../../Base/HTML/OpçãoLogin.html");
    if (!funcionario) { /* redirecionado */ } else {

      mostrarFuncionarioNoPerfil(funcionario);
      document.querySelector("#btnSair").addEventListener("click", (e) => {
        e.preventDefault();
        sair("../../Base/HTML/Abertura.html");
      });

      let reservas = [];
      const esperas = new Map();
      const esperasSaida = new Map();

      function mostrarDataHora(texto) {
        if (!texto) return "--";
        const data = new Date(texto);
        const dia = String(data.getDate()).padStart(2, "0");
        const mes = String(data.getMonth() + 1).padStart(2, "0");
        const hora = String(data.getHours()).padStart(2, "0");
        const minuto = String(data.getMinutes()).padStart(2, "0");
        return `${dia}/${mes} ${hora}:${minuto}`;
      }

      function botoes(item) {
        const status = item.reserva.status;

        if (Presenca.aguardandoChegada(status)) {
          const espera = item.codigoPresenca
            ? `<small class="espera-chip">Aguardando cliente</small>`
            : "";
          const esperaSaida = item.codigoSaida
            ? `<small class="espera-chip">Aguardando saída</small>`
            : "";

          return `
      <div class="acoes">
        <button class="btn btn-verde"
          onclick="abrirChegada('${item.id}')">
          Cliente chegou
        </button>
        <button class="btn btn-vermelho"
          onclick="abrirSaida('${item.id}')">
          Código de saída
        </button>
        ${espera}${esperaSaida}
      </div>
    `;
        }

        if (status === "Ativa") {
          const esperaSaida = item.codigoSaida
            ? `<small class="espera-chip">Aguardando saída</small>`
            : "";
          return `
      <div class="acoes">
        <button class="btn btn-azul"
          onclick="encerrar('${item.id}')">
          Encerrar
        </button>
        <button class="btn btn-vermelho"
          onclick="abrirSaida('${item.id}')">
          Código de saída
        </button>
        ${esperaSaida}
      </div>
    `;
        }

        return "--";
      }

      function render() {
        const status = document.getElementById("filtroStatus").value;
        const busca = document.getElementById("busca").value.toLowerCase();
        const filtradas = reservas.filter((item) => {
          const texto = `${item.usuario?.nome || ""} ${item.reserva.vaga.numero} ${item.carro?.placacarro || ""}`.toLowerCase();
          return (!status || item.reserva.status === status) && texto.includes(busca);
        });

        const corpo = document.getElementById("linhas");
        if (filtradas.length === 0) {
          corpo.innerHTML = `<tr><td colspan="6" class="vazio">Nenhuma reserva neste pátio.</td></tr>`;
          return;
        }

        corpo.innerHTML = filtradas.map((item) => `
        <tr>
          <td>
            <strong>${item.usuario?.nome || "Cliente"}</strong><br>
            <small>${item.carro ? item.carro.modelo + " · " + item.carro.placacarro : "Sem veículo"}</small>
          </td>
          <td><b>${item.reserva.vaga.numero}</b></td>
          <td>${mostrarDataHora(item.hora)}</td>
          <td>${mostrarDataHora(item.horaSaida)}</td>
          <td><span class="status ${String(item.reserva.status || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")}">${item.reserva.status}</span></td>
          <td>${botoes(item)}</td>
        </tr>
      `).join("");
      }

      async function carregar() {
        const resposta = await fetch(API + "/reservacli");
        const lista = await resposta.json();
        if (!resposta.ok) throw new Error(lista.erro || "Erro ao carregar as reservas");
        reservas = lista
          .filter((item) => item.reserva?.vaga?.fk_est === funcionario.fk_est)
          .sort((a, b) => new Date(b.hora) - new Date(a.hora));
        render();
        sincronizarEsperas();
      }

      async function atualizarVaga(vaga, status) {
        await fetch(API + "/vaga/" + vaga.id, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            numero: vaga.numero,
            tipo: vaga.tipo,
            status,
            preco: vaga.preco,
            fk_est: vaga.fk_est
          })
        });
      }

      async function atualizarReserva(item, status) {
        const resposta = await fetch(API + "/reserva/" + item.fk_idReserva, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            status,
            fk_vaga: item.reserva.fk_vaga
          })
        });
        const retorno = await resposta.json();
        if (!resposta.ok) throw new Error(retorno.erro || "Erro ao atualizar a reserva");
      }

      async function abrirChegada(id) {
        const item = reservas.find((reserva) => reserva.id === id);
        if (!item) return;
        Presenca.modalPatio({
          item: item,
          aoConfirmar: carregar,
          aoFechar: carregar
        });
      }

      function abrirSaida(id) {
        const item = reservas.find((reserva) => reserva.id === id);
        if (!item) return;
        Presenca.modalPatioSaida({
          item: item,
          aoConfirmar: carregar,
          aoFechar: carregar
        });
      }

      function sincronizarEsperas() {
        const ids = new Set(
          reservas
            .filter((item) => Presenca.aguardandoChegada(item.reserva?.status) && item.codigoPresenca)
            .map((item) => item.id)
        );

        for (const [id, conn] of [...esperas]) {
          if (!ids.has(id)) {
            conn.fechar();
            esperas.delete(id);
          }
        }

        ids.forEach((id) => {
          if (esperas.has(id)) return;
          esperas.set(id, Presenca.esperar(id, () => {
            const conn = esperas.get(id);
            if (conn) conn.fechar();
            esperas.delete(id);
            carregar();
          }));
        });

        const idsSaida = new Set(
          reservas
            .filter((item) => Presenca.podeEstornar(item.reserva?.status) && item.codigoSaida)
            .map((item) => item.id)
        );

        for (const [id, conn] of [...esperasSaida]) {
          if (!idsSaida.has(id)) {
            conn.fechar();
            esperasSaida.delete(id);
          }
        }

        idsSaida.forEach((id) => {
          if (esperasSaida.has(id)) return;
          esperasSaida.set(id, Presenca.esperar(id, () => {
            const conn = esperasSaida.get(id);
            if (conn) conn.fechar();
            esperasSaida.delete(id);
            carregar();
          }, { evento: "saida-confirmada", status: "Cancelada" }));
        });
      }

      async function encerrar(id) {
        const item = reservas.find((reserva) => reserva.id === id);
        if (!confirm("Encerrar esta reserva e liberar a vaga?")) return;
        try {
          await atualizarReserva(item, "Concluída");
          await atualizarVaga(item.reserva.vaga, "Livre");
          await carregar();
        } catch (error) {
          alert(error.message || "Não foi possível encerrar a reserva.");
        }
      }

      async function cancelar(id) {
        const item = reservas.find((reserva) => reserva.id === id);
        if (!confirm("Cancelar esta reserva?")) return;
        try {
          await atualizarReserva(item, "Cancelada");
          await atualizarVaga(item.reserva.vaga, "Livre");
          await carregar();
        } catch (error) {
          alert(error.message || "Não foi possível cancelar a reserva.");
        }
      }

      window.abrirChegada = abrirChegada;
      window.abrirSaida = abrirSaida;
      window.encerrar = encerrar;

      document.getElementById("filtroStatus").addEventListener("change", render);
      document.getElementById("busca").addEventListener("input", render);

      carregar().catch((error) => alert(error.message || "Verifique se o servidor está ligado."));
    }

        html[data-tema="claro"] .acoes .btn-azul:hover{

            background:#1b5fd9 !important;

            border-color:#1b5fd9 !important;

            color:#ffffff !important;

        }

        html[data-tema="claro"] .acoes .btn-vermelho{

            background:rgba(198,47,47,.06) !important;

            border-color:rgba(198,47,47,.34) !important;

            color:#a82222 !important;

        }

        html[data-tema="claro"] .acoes .btn-vermelho:hover{

            background:#c62f2f !important;

            border-color:#c62f2f !important;

            color:#ffffff !important;

        }

        html[data-tema="claro"] .acoes .btn:focus-visible{

            outline:2px solid #1b5fd9 !important;

            outline-offset:2px;

        }


        /* ---------- etiqueta de espera ----------
           "Aguardando cliente" / "Aguardando saída"
        */

        html[data-tema="claro"] .espera-chip{

            background:rgba(168,106,6,.1) !important;

            border-color:rgba(168,106,6,.3) !important;

            color:#8a5605 !important;

        }


        /* ---------- celular ---------- */

        @media (max-width:900px){

            html[data-tema="claro"] .sidebar{ background:#ffffff !important; }

            html[data-tema="claro"] .sidebar.open{

                box-shadow:14px 0 40px rgba(20,60,100,.2) !important;

            }

        }


        /* ---------- o botão do tema ----------
           z-index baixo para ficar atrás dos modais de
           presença, que abrem por cima de tudo.
        */

        .tema-botao{

            position:fixed;

            right:18px;

            bottom:18px;

            z-index:50;

            width:44px;

            height:44px;

            display:grid;

            place-items:center;

            border:1px solid rgba(120,170,220,.34);

            border-radius:10px;

            background:#0a1d33;

            color:#8cc2ff;

            cursor:pointer;

            box-shadow:0 10px 26px rgba(0,0,0,.4);

            transition:border-color .18s, background .18s, color .18s, transform .18s;

        }

        .tema-botao:hover{

            border-color:#2f7dff;

            background:#2f7dff;

            color:#ffffff;

            transform:translateY(-2px);

        }

        .tema-botao svg{ width:19px; height:19px; stroke-width:1.8; }

        html[data-tema="claro"] .tema-botao{

            border-color:rgba(20,60,100,.22);

            background:#ffffff;

            color:#1b5fd9;

            box-shadow:0 10px 26px rgba(20,60,100,.16);

        }

        html[data-tema="claro"] .tema-botao:hover{

            border-color:#1b5fd9;

            background:#1b5fd9;

            color:#ffffff;

        }

        @media (max-width:520px){

            .tema-botao{ right:14px; bottom:14px; width:40px; height:40px; }

        }

        `;


        /* =================================================
           INJETA O CSS
        ================================================= */

        const folha = document.createElement("style");

        folha.id = "tema-claro-estilo";

        folha.textContent = estilo;

        document.head.appendChild(folha);


        /* =================================================
           APLICA O QUE ESTAVA SALVO
        ================================================= */

        if(localStorage.getItem(CHAVE) === "claro"){

            document.documentElement.setAttribute("data-tema", "claro");

        }


        /* =================================================
           DESENHOS DO BOTÃO
        ================================================= */

        const sol = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="4.2"/>
                <path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6
                         M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>
            </svg>`;


        const lua = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
            </svg>`;


        /* =================================================
           BOTÃO
        ================================================= */

        function criarBotao(){

            if(document.querySelector(".tema-botao")) return;


            const botao = document.createElement("button");

            botao.className = "tema-botao";

            botao.type = "button";

            document.body.appendChild(botao);


            function pintar(){

                const claro = document.documentElement.getAttribute("data-tema") === "claro";

                botao.innerHTML = claro ? lua : sol;

                botao.title = claro ? "Mudar para o modo escuro" : "Mudar para o modo claro";

                botao.setAttribute("aria-label", botao.title);

                botao.setAttribute("aria-pressed", claro ? "true" : "false");

            }


            botao.addEventListener("click", () => {

                const claro = document.documentElement.getAttribute("data-tema") === "claro";


                if(claro){

                    document.documentElement.removeAttribute("data-tema");

                    localStorage.setItem(CHAVE, "escuro");

                } else {

                    document.documentElement.setAttribute("data-tema", "claro");

                    localStorage.setItem(CHAVE, "claro");

                }


                pintar();

            });


            pintar();

        }


        if(document.readyState === "loading"){

            document.addEventListener("DOMContentLoaded", criarBotao);

        } else {

            criarBotao();

        }


        /* =================================================
           ATALHO DE TECLADO: Shift + T
           Não dispara enquanto você digita na busca.
        ================================================= */

        document.addEventListener("keydown", (evento) => {

            if(evento.shiftKey && (evento.key === "T" || evento.key === "t")){

                const alvo = evento.target;

                if(alvo && ["INPUT", "TEXTAREA", "SELECT"].includes(alvo.tagName)) return;

                const botao = document.querySelector(".tema-botao");

                if(botao) botao.click();

            }

        });

    })();
  
  </script>
</body>

</html>
