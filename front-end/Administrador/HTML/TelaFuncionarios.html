<head>

      <nav>

        <a href="../HTML/TelaEstacionamento.html"><i data-icon="building"></i>Estacionamentos</a>
        <a href="../HTML/TelaVagas.html"><i data-icon="car"></i>Vagas</a>

        <a href="../HTML/TelaUsuarios.html"><i data-icon="users"></i>Usuários</a>

        <a href="../HTML/TelaProrrongações.html"><i data-icon="clock"></i>Prorrongações</a>
        <a href="../HTML/TelaFeedback.html"><i data-icon="message"></i>Feedbacks</a>

        <a href="../HTML/TelaPagamentos.html"><i data-icon="credit-card"></i>Pagamento Taxa</a>
        <a href="../HTML/TelaPagamentosTempo.html"><i data-icon="credit-card"></i>Pagamento Tempo</a>
        <a href="../HTML/TelaFaturamento.html"><i data-icon="chart"></i>Faturamento</a>
        <a href="../HTML/TelaConfigurações.html"><i data-icon="settings"></i>Configurações</a>

      <div class="profile">
        <span class="avatar">A</span>

        <div>
          <strong>Administrador</strong>
          <small>admin</small>
        </div>

        <i data-icon="more-vertical"></i>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <button class="menu-button" id="menuButton">
          <i data-icon="menu"></i>
        </button>

        <div>
          <h1>Funcionários</h1>
          <p>Gerencie os funcionários cadastrados.</p>
        </div>

        <a href="../HTML/CadasFunc.html">
          <button class="primary-button" id="newEmployee">
            <i data-icon="plus"></i>
            Novo funcionário
          </button>
        </a>
      </header>

      <section class="panel">
        <div class="toolbar">
          <label class="search-box">
            <i data-icon="search"></i>
            <input id="searchInput" type="search" placeholder="Buscar funcionário...">
          </label>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>Cargo</th>
                <th>CPF</th>
                <th>Telefone</th>
                <th>Estacionamento</th>
                <th class="actions-title">Ações</th>
              </tr>
            </thead>

            <tbody id="employeeRows"></tbody>
          </table>
        </div>

        <p class="table-count" id="tableCount"></p>
      </section>
    </main>
  </div>

  <script src="../../Base/JS/sessao.js"></script>
  <script>
    const api = "http://localhost:3333";

    const funcionarioLogado = exigirLogin("admin", "../../Base/HTML/OpçãoLogin.html");

    mostrarFuncionarioNoPerfil(funcionarioLogado);

    document.querySelector("#btnSair").addEventListener("click", (event) => {
      event.preventDefault();
      sair("../../Base/HTML/Abertura.html");
    });

    let employees = [];

    const icons = {
      grid: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',

      building: '<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 7h1m3 0h1m3 0h1M8 11h1m3 0h1m3 0h1M8 15h1m3 0h1m3 0h1M10 21v-3h4v3"/>',

      car: '<path d="M5 17H3v-4l2-5h14l2 5v4h-2M5 17h14M7 17v2m10-2v2M5 13h14"/><circle cx="7" cy="15" r="1"/><circle cx="17" cy="15" r="1"/>',

      calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',

      users: '<circle cx="9" cy="8" r="3"/><path d="M3 21v-2a6 6 0 0 1 12 0v2M16 4a3 3 0 0 1 0 6M21 21v-2a6 6 0 0 0-3-5.2"/>',

      briefcase: '<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5h8v2M3 12h18M10 12v2h4v-2"/>',

      message: '<path d="M21 11.5a8 8 0 0 1-8.5 8 9 9 0 0 1-4-.9L3 20l1.4-4A8 8 0 1 1 21 11.5Z"/>',

      refund: '<path d="M3 12a9 9 0 1 0 3.2-6.9"/><path d="M3 4.5V10h5.5"/>',

      chart: '<path d="M4 19V5"/>' + '<path d="M4 19h16"/>' + '<path d="M8 15v-3"/>' + '<path d="M12 15V8"/>' + '<path d="M16 15V5"/>',

      "credit-card": '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h2"/>',

      file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h6"/>',

      settings: '<circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/>',

      "log-out": '<path d="M10 17l5-5-5-5M15 12H3M21 19V5a2 2 0 0 0-2-2h-5"/>',

      "more-vertical": '<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>',

      menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',

      plus: '<path d="M12 5v14M5 12h14"/>',

      search: '<circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/>',

      edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/>',

      trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 15H6L5 6M10 11v6m4-6v6"/>',

      /* novos, usados na tela de prorrogações */
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3.5 2"/><path d="M3.5 9.5 6 7l2.5 2.5"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
      refresh: '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>'
    };

    const svg = (name) => `
      <svg viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="1.8"
           stroke-linecap="round"
           stroke-linejoin="round">
        ${icons[name]}
      </svg>
    `;

    document.querySelectorAll("i[data-icon]").forEach((icon) => {
      icon.outerHTML = svg(icon.dataset.icon);
    });

    const rows = document.querySelector("#employeeRows");
    const count = document.querySelector("#tableCount");

    function render(data) {
      rows.innerHTML = "";

      if (data.length === 0) {

        rows.innerHTML = `
<tr>
<td colspan="6">Nenhum funcionário cadastrado.</td>
</tr>
`;

        count.textContent = "Mostrando 0 funcionário(s)";

        return;

      }

      data.forEach((employee) => {

        rows.innerHTML += `
<tr>

<td>${employee.nome}</td>

<td>${employee.tipoFunc.nome}</td>

<td>${employee.cpf}</td>

<td>${employee.telefone}</td>

<td>

<span class="status active-status">
${employee.estacionamento.nome}
</span>

</td>

<td class="row-actions">

<button onclick="editarFuncionario('${employee.id}')">
${svg("edit")}
</button>

<button class="delete"
onclick="excluirFuncionario('${employee.id}')">
${svg("trash")}
</button>

</td>

</tr>
`;

      });

      count.textContent =
        `Mostrando ${data.length} funcionário(s)`;


    }

    async function carregarFuncionarios() {

      try {

        const resposta = await fetch(api + "/funcionario");

        const lista = await resposta.json();

        if (!resposta.ok) {
          throw new Error(lista.erro || "Erro ao carregar os funcionários");
        }

        employees = lista;

        render(employees);

      } catch (error) {

        alert(error.message || "Não foi possível carregar. Verifique se o servidor está ligado.");

      }

    }

    async function excluirFuncionario(id) {

      if (!confirm("Deseja realmente excluir este funcionário?")) return;

      try {

        const resposta = await fetch(api + "/funcionario/" + id, {
          method: "DELETE"
        });

        const retorno = await resposta.json();

        if (!resposta.ok) {
          throw new Error(retorno.erro || "Erro ao excluir o funcionário");
        }

        await carregarFuncionarios();

      } catch (error) {

        alert(error.message || "Não foi possível excluir o funcionário.");

      }

    }

    function editarFuncionario(id) {

      window.location.href = "../HTML/CadasFunc.html?id=" + id;

    }

    carregarFuncionarios();

    document.querySelector("#searchInput").addEventListener("input", (event) => {
      const search = event.target.value.toLowerCase();

      const filtered = employees.filter((employee) =>

        employee.nome.toLowerCase().includes(search) ||

        employee.tipoFunc.nome.toLowerCase().includes(search) ||

        employee.cpf.toLowerCase().includes(search) ||

        employee.telefone.toLowerCase().includes(search)

      );

      render(filtered);
    });

    document.querySelector("#menuButton").addEventListener("click", () => {
      document.querySelector("#sidebar").classList.toggle("open");
    });


    /* =====================================================
   VagaConnect · tema.js

   Liga o modo claro em qualquer tela do sistema.
   O escuro continua sendo o padrão.

   COMO USAR
   Em cada tela, depois do CSS dela:

===================================================== */

(function(){

    "use strict";


    const CHAVE = "vagaconnect-tema";


    // aplica antes de desenhar, para a tela não piscar
    const salvo = localStorage.getItem(CHAVE);

    if(salvo === "claro"){

        document.documentElement.setAttribute("data-tema", "claro");

    }



    /* =================================================
       DESENHOS DO BOTÃO
    ================================================= */

    const sol = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6
                     M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>
        </svg>`;


    const lua = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
        </svg>`;



    /* =================================================
       BOTÃO
    ================================================= */

    function criarBotao(){

        if(document.querySelector(".tema-botao")) return;


        const botao = document.createElement("button");

        botao.className = "tema-botao";

        botao.type = "button";

        document.body.appendChild(botao);


        function pintar(){

            const claro = document.documentElement.getAttribute("data-tema") === "claro";

            botao.innerHTML = claro ? lua : sol;

            botao.title = claro ? "Mudar para o modo escuro" : "Mudar para o modo claro";

            botao.setAttribute("aria-label", botao.title);

            botao.setAttribute("aria-pressed", claro ? "true" : "false");

        }


        botao.addEventListener("click", () => {

            const claro = document.documentElement.getAttribute("data-tema") === "claro";


            if(claro){

                document.documentElement.removeAttribute("data-tema");

                localStorage.setItem(CHAVE, "escuro");

            } else {

                document.documentElement.setAttribute("data-tema", "claro");

                localStorage.setItem(CHAVE, "claro");

            }


            pintar();

        });


        pintar();

    }


    if(document.readyState === "loading"){

        document.addEventListener("DOMContentLoaded", criarBotao);

    } else {

        criarBotao();

    }



    /* =================================================
       ATALHO DE TECLADO: Shift + T
    ================================================= */

    document.addEventListener("keydown", (evento) => {

        if(evento.shiftKey && (evento.key === "T" || evento.key === "t")){

            const alvo = evento.target;

            const digitando = alvo && ["INPUT", "TEXTAREA", "SELECT"].includes(alvo.tagName);

            if(digitando) return;


            const botao = document.querySelector(".tema-botao");

            if(botao) botao.click();

        }

    });

})();
    
  </script>
</body>

</html>
